name: Deploy to EC2

on:
  push:
    branches:
      - despliegue

jobs:
  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Deploy via SSH
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@ec2-52-203-212-207.compute-1.amazonaws.com << 'EOF'
          echo "🔄 Actualizando Docker Compose..."
          
          # Actualizar Docker Compose a la versión más reciente
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          
          # Verificar versión
          docker-compose --version
        
          cd /home/ubuntu/backend_ClubYa
          git pull origin despliegue
          sudo systemctl start docker
          sudo docker-compose down
          sudo docker container prune -f
          sudo docker image prune -f
          sudo docker-compose build
          sudo docker-compose up -d
        EOF
